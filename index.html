<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#0f172a">
    <title>ScreenSpark | مشاركة شاشة احترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0f172a, #020617);
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header جدي */
        .glass-header {
            backdrop-filter: blur(16px);
            background: rgba(15, 23, 42, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #4f46e5, #ec4899);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }
        .logo-text {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, #a5f3fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .theme-toggle {
            background: rgba(255,255,255,0.05);
            border: none;
            color: #cbd5e1;
            width: 40px;
            height: 40px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }
        .theme-toggle:hover {
            background: #4f46e5;
            color: white;
        }

        /* Main Content */
        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* بطاقة التحكم الجدية */
        .control-card {
            max-width: 650px;
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        .control-card h2 {
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            margin-bottom: 2rem;
        }
        .online-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 6px #10b981;
        }

        /* أزرار وأقسام الدخول والإنشاء */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin: 2rem 0;
        }
        .create-session {
            background: linear-gradient(135deg, #4f46e5, #ec4899);
            border: none;
            border-radius: 60px;
            padding: 1rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(79,70,229,0.3);
        }
        .create-session:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 28px rgba(79,70,229,0.5);
        }

        .join-section {
            background: rgba(255,255,255,0.03);
            border-radius: 1.5rem;
            padding: 1.2rem;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .join-label {
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .join-input-group {
            display: flex;
            gap: 12px;
        }
        .join-input-group input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px 18px;
            border-radius: 40px;
            color: white;
            font-family: monospace;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .join-input-group input:focus {
            border-color: #4f46e5;
        }
        .join-btn {
            background: #1e293b;
            border: 1px solid #4f46e5;
            padding: 0 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }
        .join-btn:hover {
            background: #4f46e5;
        }

        /* قسم إدارة الجلسة (بعد بدء الجلسة) */
        .session-panel {
            margin-top: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 1.5rem;
        }
        .room-header {
            background: #0f172a;
            padding: 12px 16px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .room-link-text {
            font-family: monospace;
            font-size: 0.8rem;
            word-break: break-all;
            color: #a5f3fc;
        }
        .copy-room {
            background: #334155;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .video-preview {
            margin: 1rem 0;
            background: #000;
            border-radius: 1rem;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #334155;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 1rem;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #4f46e5;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }
        .btn-outline:hover {
            background: #4f46e5;
        }
        .btn-danger {
            background: rgba(239,68,68,0.2);
            border: 1px solid #ef4444;
            color: #fecaca;
        }
        .btn-danger:hover {
            background: #ef4444;
            color: white;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            opacity: 0;
            transition: 0.2s;
            z-index: 200;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }
        .hidden {
            display: none;
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.7rem;
            color: #64748b;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        @media (max-width: 600px) {
            .control-card { padding: 1.5rem; }
            .join-input-group { flex-direction: column; }
            .room-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="glass-header">
    <div class="logo-area">
        <div class="logo-icon"><i class="fas fa-desktop"></i></div>
        <div class="logo-text">ScreenSpark</div>
    </div>
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-moon"></i></button>
</div>

<main class="main-container">
    <div class="control-card" id="mainCard">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>✨ شارك شاشتك <br> بلحظة</h2>
            <div class="status-chip"><span class="online-dot"></span> مباشر | WebRTC</div>
        </div>
        <p style="color: #94a3b8; margin-top: 8px;">جودة عالية • مشفر • بدون تأخير</p>

        <!-- القسم الرئيسي (اختيار: إنشاء جلسة أو انضمام) -->
        <div id="entrySection">
            <div class="action-group">
                <button class="create-session" id="createRoomBtn"><i class="fas fa-plus-circle"></i> إنشاء جلسة جديدة</button>
                <div class="join-section">
                    <span class="join-label"><i class="fas fa-link"></i> انضم إلى جلسة عبر الرابط</span>
                    <div class="join-input-group">
                        <input type="text" id="joinRoomInput" placeholder="أدخل رمز الجلسة (مثال: X7K9M2)">
                        <button class="join-btn" id="joinRoomBtn">انضمام</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- قسم إدارة الجلسة (بعد إنشاء الجلسة أو الانضمام) -->
        <div id="sessionPanel" class="hidden session-panel">
            <div class="room-header">
                <span class="room-link-text" id="roomLinkDisplay">جاري إنشاء الرابط...</span>
                <button class="copy-room" id="copyLinkBtn"><i class="fas fa-copy"></i> نسخ الرابط</button>
            </div>
            <div class="video-preview" id="videoContainer" style="display: none;">
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
            <div class="action-buttons">
                <button class="btn-outline" id="startShareBtn"><i class="fas fa-desktop"></i> مشاركة شاشتي</button>
                <button class="btn-outline hidden" id="stopShareBtn"><i class="fas fa-stop-circle"></i> إيقاف</button>
                <button class="btn-outline btn-danger" id="leaveRoomBtn"><i class="fas fa-sign-out-alt"></i> مغادرة الجلسة</button>
            </div>
            <p style="font-size: 0.7rem; color: #64748b; text-align: center; margin-top: 12px;">
                🔒 اتصال نظير إلى نظير | لا نخزن بياناتك
            </p>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 ScreenSpark | تصميم احترافي • مشاركة فورية • General Fix Team</p>
</footer>

<div id="toastMessage" class="toast"></div>

<script>
    // Helper
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toastMessage');
        toast.textContent = msg;
        toast.style.background = isError ? '#ef4444' : '#10b981';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2800);
    }

    // Theme (light/dark/gold)
    let currentTheme = localStorage.getItem('screenspark_theme') || 'dark';
    function setTheme(theme) {
        const root = document.documentElement;
        if (theme === 'light') {
            root.style.setProperty('--bg-primary', '#f8fafc');
            root.style.setProperty('--text-primary', '#0f172a');
            // تبسيط: نغير خلفية البادي
            document.body.style.background = '#f1f5f9';
        } else if (theme === 'gold') {
            document.body.style.background = '#1a1500';
            root.style.setProperty('--text-primary', '#ffd700');
        } else {
            document.body.style.background = 'radial-gradient(circle at 20% 30%, #0f172a, #020617)';
        }
        localStorage.setItem('screenspark_theme', theme);
    }
    document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const themes = ['dark', 'light', 'gold'];
        let next = themes[(themes.indexOf(currentTheme) + 1) % themes.length];
        currentTheme = next;
        setTheme(currentTheme);
        showToast(`🎨 تم التبديل إلى ${next}`);
    });
    setTheme(currentTheme);

    // WebRTC variables
    let localStream = null;
    let peerConnection = null;
    let currentRoomId = null;

    const configuration = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'turn:turn.anyfirewall.com:443?transport=tcp', username: 'webrtc', credential: 'webrtc' }
        ]
    };

    function generateRoomId() {
        return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    async function createPeerConnection() {
        peerConnection = new RTCPeerConnection(configuration);
        if (localStream) {
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        }
        peerConnection.ontrack = (event) => {
            const video = document.getElementById('remoteVideo');
            if (video.srcObject !== event.streams[0]) {
                video.srcObject = event.streams[0];
                document.getElementById('videoContainer').style.display = 'flex';
            }
        };
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                sendSignal({ type: 'ice', candidate: event.candidate });
            }
        };
        return peerConnection;
    }

    function sendSignal(msg) {
        if (!currentRoomId) return;
        const key = `webrtc_signal_${currentRoomId}`;
        const existing = JSON.parse(localStorage.getItem(key) || '[]');
        existing.push({ ...msg, timestamp: Date.now() });
        localStorage.setItem(key, JSON.stringify(existing));
        pollSignals();
    }

    function pollSignals() {
        if (!currentRoomId) return;
        const key = `webrtc_signal_${currentRoomId}`;
        const data = JSON.parse(localStorage.getItem(key) || '[]');
        const unprocessed = data.filter(m => !m.processed);
        for (let msg of unprocessed) {
            msg.processed = true;
            if (msg.type === 'offer' && peerConnection && peerConnection.signalingState !== 'stable') {
                peerConnection.setRemoteDescription(new RTCSessionDescription(msg.offer))
                    .then(() => peerConnection.createAnswer())
                    .then(answer => peerConnection.setLocalDescription(answer))
                    .then(() => sendSignal({ type: 'answer', answer: peerConnection.localDescription }))
                    .catch(e => console.warn(e));
            } else if (msg.type === 'answer' && peerConnection) {
                peerConnection.setRemoteDescription(new RTCSessionDescription(msg.answer)).catch(e => console.warn);
            } else if (msg.type === 'ice' && peerConnection) {
                peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(e => console.warn);
            }
        }
        localStorage.setItem(key, JSON.stringify(data));
        setTimeout(pollSignals, 800);
    }

    async function startSharing() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true, preferCurrentTab: true });
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            localStream = stream;
            await createPeerConnection();
            if (peerConnection) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                sendSignal({ type: 'offer', offer });
            }
            document.getElementById('startShareBtn').classList.add('hidden');
            document.getElementById('stopShareBtn').classList.remove('hidden');
            showToast('✅ بدأت مشاركة الشاشة');
            stream.getVideoTracks()[0].onended = () => stopSharing();
        } catch (err) {
            showToast('❌ فشل مشاركة الشاشة: ' + err.message, true);
        }
    }

    function stopSharing() {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (peerConnection) peerConnection.close();
        localStream = null;
        peerConnection = null;
        document.getElementById('startShareBtn').classList.remove('hidden');
        document.getElementById('stopShareBtn').classList.add('hidden');
        document.getElementById('remoteVideo').srcObject = null;
        document.getElementById('videoContainer').style.display = 'none';
        showToast('⏹️ تم إيقاف المشاركة');
    }

    function leaveSession() {
        stopSharing();
        currentRoomId = null;
        document.getElementById('sessionPanel').classList.add('hidden');
        document.getElementById('entrySection').classList.remove('hidden');
        showToast('👋 خرجت من الجلسة');
    }

    function createSession() {
        currentRoomId = generateRoomId();
        const url = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}`;
        document.getElementById('roomLinkDisplay').innerText = url;
        document.getElementById('entrySection').classList.add('hidden');
        document.getElementById('sessionPanel').classList.remove('hidden');
        showToast('✅ تم إنشاء الجلسة');
        pollSignals();
    }

    function joinSession() {
        let room = document.getElementById('joinRoomInput').value.trim().toUpperCase();
        if (!room) { showToast('⚠️ أدخل رمز الجلسة', true); return; }
        currentRoomId = room;
        document.getElementById('entrySection').classList.add('hidden');
        document.getElementById('sessionPanel').classList.remove('hidden');
        document.getElementById('roomLinkDisplay').innerText = window.location.origin + window.location.pathname + '?room=' + room;
        showToast('✅ انضممت إلى الجلسة');
        pollSignals();
    }

    // DOM elements
    document.getElementById('createRoomBtn').addEventListener('click', createSession);
    document.getElementById('joinRoomBtn').addEventListener('click', joinSession);
    document.getElementById('startShareBtn').addEventListener('click', startSharing);
    document.getElementById('stopShareBtn').addEventListener('click', stopSharing);
    document.getElementById('leaveRoomBtn').addEventListener('click', leaveSession);
    document.getElementById('copyLinkBtn').addEventListener('click', () => {
        const link = document.getElementById('roomLinkDisplay').innerText;
        navigator.clipboard.writeText(link);
        showToast('📋 تم نسخ الرابط');
    });

    // auto join from url param
    const urlRoom = new URLSearchParams(window.location.search).get('room');
    if (urlRoom) {
        document.getElementById('joinRoomInput').value = urlRoom;
        joinSession();
    }

    // small trick: start polling after 1s
    setTimeout(pollSignals, 1000);
</script>
</body>
</html>
