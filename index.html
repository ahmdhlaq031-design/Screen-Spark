<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#0a0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ScreenSpark | شارك شاشتك فورياً وبأمان</title>
    <meta name="description" content="مشاركة شاشة فورية وآمنة عبر الرابط. بدون تحميل، بدون تسجيل، بجودة عالية.">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* ==================== المتغيرات والثيمات ==================== */
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #0f0f25;
            --bg-card: rgba(20, 20, 45, 0.85);
            --bg-input: #1a1a35;
            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            --text-muted: #8f96ad;
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --primary-light: #a78bfa;
            --primary-glow: rgba(124, 58, 237, 0.35);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --cyan: #06b6d4;
            --pink: #ec4899;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 5px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 15px 40px rgba(0,0,0,0.5);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --gradient-1: linear-gradient(135deg, #7c3aed, #a78bfa, #ec4899);
            --gradient-2: linear-gradient(135deg, #06b6d4, #3b82f6, #7c3aed);
        }
        
        body.light-mode {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.96);
            --bg-input: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
            --primary: #6d28d9;
            --primary-dark: #5b21b6;
            --primary-glow: rgba(109, 40, 217, 0.12);
        }
        
        body.gold-mode {
            --bg-primary: #1a1500;
            --bg-secondary: #2d2600;
            --bg-card: rgba(45, 38, 0, 0.92);
            --bg-input: #3d3500;
            --text-primary: #ffd700;
            --text-secondary: #ffed4a;
            --text-muted: #b8941a;
            --border-color: #6b5500;
            --primary: #ffd700;
            --primary-dark: #cca800;
            --primary-glow: rgba(255, 215, 0, 0.25);
            --gradient-1: linear-gradient(135deg, #ffd700, #f59e0b, #d97706);
            --gradient-2: linear-gradient(135deg, #ffd700, #fbbf24, #f59e0b);
        }
        
        /* ==================== خلفية متحركة ==================== */
        .animated-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: radial-gradient(ellipse at 20% 30%, var(--primary-glow), transparent 55%),
                        radial-gradient(ellipse at 80% 70%, rgba(236, 72, 153, 0.08), transparent 55%),
                        radial-gradient(ellipse at 50% 80%, rgba(6, 182, 212, 0.06), transparent 55%);
            animation: bgFloat 12s ease-in-out infinite alternate;
        }
        
        @keyframes bgFloat {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }
        
        /* ==================== جزيئات ==================== */
        .particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.5;
            animation: floatParticle linear infinite;
        }
        
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        
        /* ==================== إعدادات عامة ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        
        /* ==================== شريط التقدم ==================== */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: var(--gradient-2);
            z-index: 10000;
            transition: width 0.08s linear;
            box-shadow: 0 0 10px var(--primary-glow);
        }
        
        /* ==================== هيدر ==================== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-secondary);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        
        .logo-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-md);
            background: var(--gradient-1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: white;
            box-shadow: 0 0 20px var(--primary-glow);
            animation: pulseIcon 3s ease-in-out infinite;
        }
        
        @keyframes pulseIcon {
            0%, 100% { box-shadow: 0 0 20px var(--primary-glow); }
            50% { box-shadow: 0 0 45px var(--primary-glow); }
        }
        
        .logo-text h1 {
            font-size: 1.4rem;
            font-weight: 900;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo-text p {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: -5px;
        }
        
        .nav-actions {
            display: flex;
            gap: 12px;
        }
        
        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: var(--text-secondary);
            font-size: 1.1rem;
            backdrop-filter: blur(10px);
        }
        
        .icon-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        
        /* ==================== حاوية ==================== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px 60px;
            position: relative;
            z-index: 1;
        }
        
        /* ==================== بطاقة التحكم ==================== */
        .control-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 45px;
            backdrop-filter: blur(25px);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }
        
        .control-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--primary-glow), transparent 70%);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
        }
        
        .control-card:hover::before {
            opacity: 0.4;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-input);
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 0.8rem;
            margin-bottom: 25px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        
        /* ==================== منطقة الفيديو ==================== */
        .video-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .video-container {
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            aspect-ratio: 16 / 9;
            position: relative;
            border: 2px solid var(--border-color);
        }
        
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: white;
            backdrop-filter: blur(5px);
        }
        
        /* ==================== أزرار التحكم ==================== */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .action-btn {
            background: var(--gradient-1);
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px var(--primary-glow);
        }
        
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px var(--primary-glow);
        }
        
        .action-btn:active {
            transform: translateY(0);
        }
        
        .action-btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        
        .action-btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
        }
        
        .action-btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        
        /* ==================== رابط الجلسة ==================== */
        .room-link-box {
            background: var(--bg-input);
            border-radius: var(--radius-md);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .room-link {
            flex: 1;
            font-family: monospace;
            font-size: 1rem;
            color: var(--primary-light);
            word-break: break-all;
        }
        
        .copy-link-btn {
            background: var(--primary);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .copy-link-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        /* ==================== قائمة الأجهزة ==================== */
        .devices-panel {
            background: var(--bg-input);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-top: 20px;
        }
        
        .devices-title {
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .device-option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .device-option select {
            flex: 1;
            padding: 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
        }
        
        /* ==================== أعضاء الجلسة ==================== */
        .members-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        
        .member-badge {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .member-badge.you {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        /* ==================== إشعار ==================== */
        .toast {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%) translateY(25px);
            background: var(--success);
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            z-index: 10000;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        .toast.error {
            background: var(--danger);
        }
        
        /* ==================== زر الرجوع للأعلى ==================== */
        .back-to-top {
            position: fixed;
            bottom: 35px;
            right: 35px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--primary);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        
        .back-to-top.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        .back-to-top:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-5px);
        }
        
        /* ==================== فوتر ==================== */
        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }
        
        /* ==================== استجابة ==================== */
        @media (max-width: 768px) {
            .container { padding: 25px 15px 40px; }
            .control-card { padding: 25px; }
            .action-btn { padding: 10px 18px; font-size: 0.85rem; }
            .room-link { font-size: 0.8rem; }
            .logo-icon { width: 44px; height: 44px; font-size: 22px; }
            .logo-text h1 { font-size: 1.1rem; }
            .back-to-top { bottom: 20px; right: 20px; width: 45px; height: 45px; }
            .toast { white-space: normal; text-align: center; max-width: 90%; }
        }
    </style>
</head>
<body>

<div class="animated-bg"></div>
<div class="particles" id="particles"></div>
<div class="scroll-progress" id="scrollProgress"></div>

<!-- زر الرجوع للأعلى -->
<div class="back-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'})">
    <i class="fas fa-arrow-up"></i>
</div>

<!-- الهيدر -->
<header>
    <div class="logo">
        <div class="logo-icon">
            <i class="fas fa-desktop"></i>
        </div>
        <div class="logo-text">
            <h1>ScreenSpark</h1>
            <p>مشاركة شاشة فورية وآمنة</p>
        </div>
    </div>
    <div class="nav-actions">
        <button class="icon-btn" id="themeToggleBtn"><i class="fas fa-palette"></i></button>
    </div>
</header>

<!-- المحتوى الرئيسي -->
<main class="container">
    <div class="control-card">
        <div class="status-badge" id="connectionStatus">
            <span class="status-dot"></span>
            <span>جاهز للاتصال</span>
        </div>
        
        <!-- منطقة الفيديو -->
        <div class="video-area" id="videoArea" style="display: none;">
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">شاشة الضيف</div>
            </div>
        </div>
        
        <!-- الأزرار الرئيسية -->
        <div class="action-buttons" id="mainActions">
            <button class="action-btn" id="createRoomBtn">
                <i class="fas fa-plus-circle"></i> إنشاء غرفة جديدة
            </button>
            <button class="action-btn action-btn-success" id="joinRoomBtn">
                <i class="fas fa-sign-in-alt"></i> انضمام إلى غرفة
            </button>
        </div>
        
        <!-- لوحة المشاركة (تظهر بعد إنشاء الغرفة أو الانضمام) -->
        <div id="sharingPanel" style="display: none;">
            <div class="room-link-box">
                <span class="room-link" id="roomLinkDisplay"></span>
                <button class="copy-link-btn" id="copyLinkBtn">
                    <i class="fas fa-copy"></i> نسخ الرابط
                </button>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn" id="startShareBtn">
                    <i class="fas fa-desktop"></i> مشاركة شاشتي
                </button>
                <button class="action-btn action-btn-danger" id="stopShareBtn" style="display: none;">
                    <i class="fas fa-stop-circle"></i> إيقاف المشاركة
                </button>
                <button class="action-btn action-btn-warning" id="leaveRoomBtn">
                    <i class="fas fa-sign-out-alt"></i> مغادرة الغرفة
                </button>
            </div>
            
            <!-- إعدادات الأجهزة -->
            <div class="devices-panel">
                <div class="devices-title">⚙️ إعدادات الصوت والصورة</div>
                <div class="device-option">
                    <i class="fas fa-video"></i>
                    <select id="cameraSelect"></select>
                </div>
                <div class="device-option">
                    <i class="fas fa-microphone"></i>
                    <select id="microphoneSelect"></select>
                </div>
            </div>
            
            <!-- أعضاء الغرفة -->
            <div class="devices-panel">
                <div class="devices-title">👥 أعضاء الغرفة</div>
                <div class="members-list" id="membersList">
                    <span class="member-badge you"><i class="fas fa-user"></i> أنت (المضيف)</span>
                </div>
            </div>
        </div>
        
        <!-- نافذة الانضمام (تظهر عند الضغط على انضمام) -->
        <div id="joinPanel" style="display: none;">
            <div class="room-link-box">
                <input type="text" id="roomIdInput" class="room-link" placeholder="أدخل رمز الغرفة (مثال: X7K9M2)" style="background: var(--bg-input); border: none; outline: none;">
                <button class="copy-link-btn" id="confirmJoinBtn">
                    <i class="fas fa-check"></i> تأكيد
                </button>
            </div>
            <button class="action-btn action-btn-warning" id="cancelJoinBtn">
                <i class="fas fa-arrow-right"></i> إلغاء
            </button>
        </div>
        
        <!-- رسالة عدم الدعم -->
        <div id="unsupportedMsg" class="status-badge" style="background: var(--danger); display: none;">
            <i class="fas fa-exclamation-triangle"></i>
            <span>متصفحك لا يدعم مشاركة الشاشة. يرجى استخدام Chrome أو Edge أو Firefox</span>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 ScreenSpark | جميع الحقوق محفوظة | General Fix Team</p>
    <p style="margin-top: 5px;">مشاركة شاشة فورية - بدون تحميل - بجودة عالية</p>
</footer>

<div id="toast" class="toast"></div>

<script>
    // ==================== الثيمات ====================
    let currentTheme = localStorage.getItem('screenspark_theme') || 'dark';
    
    function setTheme(theme) {
        document.body.classList.remove('light-mode', 'gold-mode');
        if (theme === 'light') document.body.classList.add('light-mode');
        if (theme === 'gold') document.body.classList.add('gold-mode');
        localStorage.setItem('screenspark_theme', theme);
        currentTheme = theme;
    }
    
    function toggleTheme() {
        const themes = ['dark', 'light', 'gold'];
        const next = themes[(themes.indexOf(currentTheme) + 1) % themes.length];
        setTheme(next);
        showToast('🎨 تم تغيير الثيم');
    }
    
    document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);
    setTheme(currentTheme);
    
    // ==================== شريط التقدم ====================
    window.addEventListener('scroll', () => {
        const winScroll = document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - window.innerHeight;
        const scrolled = (winScroll / height) * 100;
        document.getElementById('scrollProgress').style.width = scrolled + '%';
        
        const backBtn = document.querySelector('.back-to-top');
        if (window.scrollY > 400) backBtn.classList.add('visible');
        else backBtn.classList.remove('visible');
    });
    
    // ==================== إشعارات ====================
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.toggle('error', isError);
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    // ==================== جزيئات ====================
    function createParticles() {
        const container = document.getElementById('particles');
        const colors = ['#7c3aed', '#a78bfa', '#06b6d4', '#10b981'];
        
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 5 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            particle.style.animationDuration = Math.random() * 12 + 10 + 's';
            particle.style.animationDelay = Math.random() * 12 + 's';
            container.appendChild(particle);
        }
    }
    createParticles();
    
    // ==================== WebRTC ومشاركة الشاشة ====================
    let localStream = null;
    let peerConnection = null;
    let currentRoomId = null;
    let isSharing = false;
    
    // خوادم STUN/TURN المجانية (لضمان الاتصال خلف الجدران النارية)
    const configuration = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            {
                urls: 'turn:turn.anyfirewall.com:443?transport=tcp',
                username: 'webrtc',
                credential: 'webrtc'
            }
        ]
    };
    
    // التحقق من دعم المتصفح
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        document.getElementById('unsupportedMsg').style.display = 'flex';
        document.getElementById('mainActions').style.display = 'none';
        showToast('❌ متصفحك لا يدعم مشاركة الشاشة', true);
    }
    
    // ==================== دوال WebRTC ====================
    async function createPeerConnection() {
        peerConnection = new RTCPeerConnection(configuration);
        
        // إضافة المسار المحلي إلى الاتصال
        if (localStream) {
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
        }
        
        // استقبال المسار البعيد
        peerConnection.ontrack = (event) => {
            const remoteVideo = document.getElementById('remoteVideo');
            if (remoteVideo.srcObject !== event.streams[0]) {
                remoteVideo.srcObject = event.streams[0];
                document.getElementById('videoArea').style.display = 'flex';
            }
        };
        
        // جمع المرشحات ICE
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                sendSignalingMessage({ type: 'ice', candidate: event.candidate });
            }
        };
        
        peerConnection.oniceconnectionstatechange = () => {
            const status = peerConnection.iceConnectionState;
            const statusEl = document.getElementById('connectionStatus');
            if (status === 'connected') {
                statusEl.innerHTML = '<span class="status-dot"></span><span>✅ متصل - البث مباشر</span>';
                statusEl.style.background = 'rgba(16, 185, 129, 0.2)';
            } else if (status === 'disconnected') {
                statusEl.innerHTML = '<span class="status-dot"></span><span>⚠️ انقطع الاتصال</span>';
                statusEl.style.background = 'rgba(239, 68, 68, 0.2)';
            } else {
                statusEl.innerHTML = '<span class="status-dot"></span><span>🔄 جاري الاتصال...</span>';
            }
        };
    }
    
    // ==================== إشارات WebRTC (محاكاة الخادم عبر localStorage) ====================
    // في التطبيق الحقيقي، نستخدم Socket.io. هنا نستخدم localStorage للتجربة.
    function sendSignalingMessage(message) {
        if (!currentRoomId) return;
        const key = `signaling_${currentRoomId}`;
        const existing = JSON.parse(localStorage.getItem(key) || '[]');
        existing.push({ ...message, from: 'local', timestamp: Date.now() });
        localStorage.setItem(key, JSON.stringify(existing));
        checkSignalingMessages();
    }
    
    function checkSignalingMessages() {
        if (!currentRoomId) return;
        const key = `signaling_${currentRoomId}`;
        const messages = JSON.parse(localStorage.getItem(key) || '[]');
        const unprocessed = messages.filter(m => !m.processed);
        
        for (const msg of unprocessed) {
            msg.processed = true;
            if (msg.type === 'offer' && peerConnection && peerConnection.signalingState !== 'stable') {
                peerConnection.setRemoteDescription(new RTCSessionDescription(msg.offer)).then(() => {
                    return peerConnection.createAnswer();
                }).then(answer => {
                    return peerConnection.setLocalDescription(answer);
                }).then(() => {
                    sendSignalingMessage({ type: 'answer', answer: peerConnection.localDescription });
                }).catch(e => console.error(e));
            } else if (msg.type === 'answer' && peerConnection) {
                peerConnection.setRemoteDescription(new RTCSessionDescription(msg.answer)).catch(e => console.error(e));
            } else if (msg.type === 'ice' && peerConnection) {
                peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(e => console.error(e));
            }
        }
        
        localStorage.setItem(key, JSON.stringify(messages));
        setTimeout(checkSignalingMessages, 500);
    }
    
    // ==================== مشاركة الشاشة ====================
    async function startScreenShare() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: { cursor: "always", displaySurface: "monitor" },
                audio: true,
                preferCurrentTab: true
            });
            
            localStream = stream;
            isSharing = true;
            
            document.getElementById('startShareBtn').style.display = 'none';
            document.getElementById('stopShareBtn').style.display = 'inline-flex';
            
            // تحديث أجهزة الصوت
            const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const audioTrack = audioStream.getAudioTracks()[0];
            if (audioTrack) localStream.addTrack(audioTrack);
            
            await createPeerConnection();
            
            // إنشاء عرض (offer) إذا كنا المضيف
            if (peerConnection) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                sendSignalingMessage({ type: 'offer', offer: peerConnection.localDescription });
            }
            
            showToast('✅ بدأت مشاركة الشاشة');
            
            stream.getVideoTracks()[0].onended = () => {
                stopScreenShare();
            };
            
        } catch (error) {
            console.error(error);
            showToast('❌ فشل مشاركة الشاشة: ' + error.message, true);
        }
    }
    
    function stopScreenShare() {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        isSharing = false;
        document.getElementById('startShareBtn').style.display = 'inline-flex';
        document.getElementById('stopShareBtn').style.display = 'none';
        document.getElementById('remoteVideo').srcObject = null;
        document.getElementById('videoArea').style.display = 'none';
        showToast('⏹️ تم إيقاف مشاركة الشاشة');
    }
    
    // ==================== إدارة الغرفة ====================
    function generateRoomId() {
        return Math.random().toString(36).substring(2, 8).toUpperCase();
    }
    
    function createRoom() {
        currentRoomId = generateRoomId();
        const roomLink = `${window.location.origin}${window.location.pathname}?room=${currentRoomId}`;
        document.getElementById('roomLinkDisplay').textContent = roomLink;
        document.getElementById('sharingPanel').style.display = 'block';
        document.getElementById('mainActions').style.display = 'none';
        document.getElementById('joinPanel').style.display = 'none';
        
        // إضافة المستخدم لقائمة الأعضاء
        const membersList = document.getElementById('membersList');
        membersList.innerHTML = '<span class="member-badge you"><i class="fas fa-user"></i> أنت (المضيف)</span>';
        
        showToast('✅ تم إنشاء الغرفة بنجاح');
    }
    
    function joinRoom() {
        const roomId = document.getElementById('roomIdInput').value.trim().toUpperCase();
        if (!roomId) {
            showToast('⚠️ الرجاء إدخال رمز الغرفة', true);
            return;
        }
        currentRoomId = roomId;
        document.getElementById('sharingPanel').style.display = 'block';
        document.getElementById('mainActions').style.display = 'none';
        document.getElementById('joinPanel').style.display = 'none';
        
        const membersList = document.getElementById('membersList');
        membersList.innerHTML = '<span class="member-badge you"><i class="fas fa-user"></i> أنت (ضيف)</span>';
        
        showToast('✅ تم الانضمام إلى الغرفة');
    }
    
    function leaveRoom() {
        stopScreenShare();
        currentRoomId = null;
        document.getElementById('sharingPanel').style.display = 'none';
        document.getElementById('mainActions').style.display = 'flex';
        document.getElementById('joinPanel').style.display = 'none';
        document.getElementById('roomIdInput').value = '';
        showToast('👋 تم مغادرة الغرفة');
    }
    
    function copyRoomLink() {
        const link = document.getElementById('roomLinkDisplay').textContent;
        navigator.clipboard.writeText(link).then(() => {
            showToast('✅ تم نسخ الرابط');
        }).catch(() => {
            showToast('❌ فشل النسخ', true);
        });
    }
    
    // ==================== تحميل قائمة الأجهزة ====================
    async function loadDevices() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            const audioDevices = devices.filter(d => d.kind === 'audioinput');
            
            const cameraSelect = document.getElementById('cameraSelect');
            const micSelect = document.getElementById('microphoneSelect');
            
            cameraSelect.innerHTML = '<option value="">الكاميرا الافتراضية</option>';
            micSelect.innerHTML = '<option value="">الميكروفون الافتراضي</option>';
            
            videoDevices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.textContent = device.label || `كاميرا ${cameraSelect.children.length}`;
                cameraSelect.appendChild(option);
            });
            
            audioDevices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.textContent = device.label || `ميكروفون ${micSelect.children.length}`;
                micSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading devices:', error);
        }
    }
    
    // ==================== ربط الأزرار ====================
    document.getElementById('createRoomBtn').addEventListener('click', createRoom);
    document.getElementById('joinRoomBtn').addEventListener('click', () => {
        document.getElementById('mainActions').style.display = 'none';
        document.getElementById('joinPanel').style.display = 'block';
    });
    document.getElementById('confirmJoinBtn').addEventListener('click', joinRoom);
    document.getElementById('cancelJoinBtn').addEventListener('click', () => {
        document.getElementById('mainActions').style.display = 'flex';
        document.getElementById('joinPanel').style.display = 'none';
        document.getElementById('roomIdInput').value = '';
    });
    document.getElementById('startShareBtn').addEventListener('click', startScreenShare);
    document.getElementById('stopShareBtn').addEventListener('click', stopScreenShare);
    document.getElementById('leaveRoomBtn').addEventListener('click', leaveRoom);
    document.getElementById('copyLinkBtn').addEventListener('click', copyRoomLink);
    
    // التحقق من رابط الغرفة في URL
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if (roomParam) {
        document.getElementById('roomIdInput').value = roomParam;
        setTimeout(() => {
            joinRoom();
        }, 500);
    }
    
    // تحميل الأجهزة
    if (navigator.mediaDevices) {
        navigator.mediaDevices.enumerateDevices().then(loadDevices);
        navigator.mediaDevices.addEventListener('devicechange', loadDevices);
    }
    
    // بدء فحص الإشارات
    setInterval(checkSignalingMessages, 1000);
</script>
